name: AI Code Review (Gemini, CodeRabbit-style)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Install diff parser
        run: pip install --quiet unidiff

      - name: Run AI review and post inline comments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_COMMENTS: "25"
        run: |
          python3 - <<'PYEOF'
          import os, json, re, urllib.request, urllib.error
          from unidiff import PatchSet

          REPO = os.environ["GH_REPO"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          HEAD_SHA = os.environ["HEAD_SHA"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          MAX_COMMENTS = int(os.environ.get("MAX_COMMENTS", "25"))

          with open("pr.diff") as f:
              diff_text = f.read()

          if not diff_text.strip():
              with open("summary.md", "w") as f:
                  f.write("## 🤖 AI Code Review\n\nNo diff content to review (empty or binary-only change).")
              raise SystemExit(0)

          patch = PatchSet(diff_text)

          file_blocks = []
          commentable = set()

          for patched_file in patch:
              if patched_file.is_binary_file:
                  continue
              path = patched_file.path
              lines_out = []
              for hunk in patched_file:
                  for line in hunk:
                      if line.is_added:
                          lineno = line.target_line_no
                          commentable.add((path, lineno))
                          lines_out.append(f"{lineno:>5} + {line.value.rstrip()}")
                      elif line.is_context:
                          lineno = line.target_line_no
                          lines_out.append(f"{lineno:>5}   {line.value.rstrip()}")
              if lines_out:
                  file_blocks.append(f"### File: {path}\n" + "\n".join(lines_out))

          diff_context = "\n\n".join(file_blocks)[:100000]

          prompt = f"""You are an expert code reviewer, similar to CodeRabbit. Review the following pull request changes.

Each file is shown with new-file line numbers. Lines marked with '+' were added or changed in this PR - only flag issues on these lines. Lines with no '+' are unchanged context, shown for reference only.

Look for: bugs, security vulnerabilities, performance problems, error-handling gaps, style/readability issues, and missing tests.

Respond with ONLY a JSON object matching this exact schema - no markdown fences, no prose outside the JSON:

{{
  "summary": "2-4 sentence high-level summary of what this PR does and its overall quality",
  "issues": [
    {{
      "file": "path/as/shown/above",
      "line": 123,
      "severity": "Critical" | "High" | "Medium" | "Low",
      "comment": "explanation of the issue",
      "suggestion": "replacement code for this exact line, or null if there's no concrete one-line fix"
    }}
  ]
}}

If there are no issues, return an empty issues array.

CODE:
{diff_context}
"""

          MODEL = "gemini-3.6-flash"
          body = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode()
          req = urllib.request.Request(
              f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent",
              data=body,
              headers={"content-type": "application/json", "x-goog-api-key": GEMINI_API_KEY}
          )
          with urllib.request.urlopen(req) as resp:
              result = json.load(resp)

          raw_text = result["candidates"][0]["content"]["parts"][0]["text"]
          cleaned = re.sub(r"^```(?:json)?|```$", "", raw_text.strip(), flags=re.MULTILINE).strip()

          try:
              parsed = json.loads(cleaned)
          except json.JSONDecodeError:
              parsed = {"summary": raw_text, "issues": []}

          summary = parsed.get("summary", "")
          issues = parsed.get("issues", [])

          SEVERITY_RANK = {"Critical": 0, "High": 1, "Medium": 2, "Low": 3}
          SEVERITY_ICON = {"Critical": "🔴", "High": "🟠", "Medium": "🟡", "Low": "🔵"}
          issues.sort(key=lambda i: SEVERITY_RANK.get(i.get("severity", "Medium"), 2))
          issues_to_post = issues[:MAX_COMMENTS]
          overflow = len(issues) - len(issues_to_post)

          def gh_api(method, path, payload=None):
              url = f"https://api.github.com{path}"
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f"  -> GitHub API error {e.code} on {path}: {e.read().decode()}")
                  return None

          posted, skipped = 0, 0
          for issue in issues_to_post:
              path = issue.get("file")
              line = issue.get("line")
              if (path, line) not in commentable:
                  print(f"Skipping comment on {path}:{line} - not a changed line in this diff")
                  skipped += 1
                  continue

              icon = SEVERITY_ICON.get(issue.get("severity", "Medium"), "🟡")
              text = f"{icon} **{issue.get('severity', 'Medium')}**: {issue.get('comment', '')}"
              if issue.get("suggestion"):
                  text += f"\n\n```suggestion\n{issue['suggestion']}\n```"

              result = gh_api("POST", f"/repos/{REPO}/pulls/{PR_NUMBER}/comments", {
                  "commit_id": HEAD_SHA,
                  "path": path,
                  "line": line,
                  "side": "RIGHT",
                  "body": text
              })
              if result is not None:
                  posted += 1

          notes = []
          if skipped:
              notes.append(f"{skipped} issue(s) skipped (line not part of this diff)")
          if overflow:
              notes.append(f"{overflow} lower-priority issue(s) not posted (MAX_COMMENTS limit)")
          note_text = f" ({'; '.join(notes)})" if notes else ""

          summary_body = (
              f"## 🤖 AI Code Review\n\n{summary}\n\n"
              f"**{posted} inline comment(s) posted** across {len(issues)} issue(s) found{note_text}"
          )

          with open("summary.md", "w") as f:
              f.write(summary_body)
          PYEOF

      - name: Post summary comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md