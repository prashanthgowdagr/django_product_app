<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product catalog</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #fafafa;
        }
        h1 { font-size: 22px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #e2e2e2;
        }
        th { color: #666; font-weight: 500; font-size: 13px; text-transform: uppercase; }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-danger { background: #dc2626; }
        .input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        form.inline { display: inline; }
        .empty { color: #888; padding: 20px 0; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
